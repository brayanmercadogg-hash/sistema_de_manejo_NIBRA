<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor por Usuario - GitHub</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; }
        
        /* Modal de Login */
        #pantalla-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .login-box h2 { margin-top: 0; color: #333; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .login-box button:hover { background: #0056b3; }

        /* Contenedor Principal */
        .app-container { display: flex; width: 100%; height: 100%; }
        #gui { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; }
        .form-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; padding: 4px 8px; font-size: 0.9em; }
        .btn-danger:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        
        /* Terminal (Solo Admin) */
        #terminal-container { flex: 1; background: #121212; color: #00ff00; font-family: 'Consolas', monospace; padding: 20px; display: flex; flex-direction: column; border-left: 2px solid #333; }
        #consola { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; }
        .linea-input { display: flex; }
        .prompt { margin-right: 10px; }
        #inputComando { background: transparent; border: none; color: #ffffff; font-family: inherit; font-size: 1rem; flex-grow: 1; outline: none; }
        
        .logout-btn { background: #6c757d; }
        .logout-btn:hover { background: #5a6268; }
    </style>
</head>
<body>

    <!-- MODAL DE IDENTIFICACIÓN -->
    <div id="pantalla-login">
        <div class="login-box">
            <h2>Identificación</h2>
            <input type="text" id="inputUsuario" placeholder="Ingresa tu nombre de usuario" autocomplete="off">
            <button onclick="verificarUsuario()" id="btnContinuar">Continuar</button>

            <!-- Campos adicionales si es Administrador -->
            <div id="bloqueAdmin" style="display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
                <p style="font-size: 0.9rem; color: #28a745; margin-bottom: 10px;"><b>¡Hola Administrador!</b> Configura tu acceso:</p>
                <input type="text" id="repoOwner" placeholder="Usuario de GitHub">
                <input type="text" id="repoName" placeholder="Nombre del Repositorio">
                <input type="password" id="githubToken" placeholder="GitHub Personal Token">
                <button onclick="entrarComoAdmin()" style="background: #28a745;">Acceder como Admin</button>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div class="app-container" id="appMain" style="display: none;">
        
        <!-- PARTE VISUAL -->
        <div id="gui">
            <div class="card" id="panelAdminControls" style="display: none;">
                <h2>Panel de Administración</h2>
                <div class="form-group">
                    <input type="text" id="guiNombre" placeholder="Nombre del producto" autocomplete="off">
                    <input type="number" id="guiPrecio" placeholder="Precio" autocomplete="off">
                    <button onclick="agregarGrafico()">Registrar</button>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 style="margin: 0;">Inventario en Tiempo Real</h2>
                        <span id="lblInfoUsuario" style="font-size: 0.85rem; color: #666;"></span>
                    </div>
                    <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
                </div>
                <br>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th id="thAccion" style="display:none;">Acción</th></tr>
                    </thead>
                    <tbody id="tablaProductos"></tbody>
                </table>
            </div>
        </div>

        <!-- TERMINAL (Solo Admin) -->
        <div id="terminal-container" style="display: none;">
            <div id="consola">Terminal de Administración activa.\nEscribe 'help' para ver los comandos.\n\n</div>
            <div class="linea-input">
                <span class="prompt" id="promptUser">admin@servidor:~$</span>
                <input type="text" id="inputComando" autocomplete="off">
            </div>
        </div>

    </div>

    <script>
        // Lista de usuarios considerados administradores (puedes agregar los que necesites)
        const ADMINS_AUTORIZADOS = ['admin', 'root', 'brayan'];

        let usuarioActual = localStorage.getItem('app_usuario') || '';
        let rolActual = localStorage.getItem('app_rol') || '';

        // Cargar credenciales guardadas si existen
        document.getElementById('repoOwner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('repoName').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('githubToken').value = localStorage.getItem('gh_token') || '';

        if (usuarioActual && rolActual) {
            iniciarApp(rolActual, usuarioActual);
        }

        function verificarUsuario() {
            const usuario = document.getElementById('inputUsuario').value.trim().toLowerCase();
            if (!usuario) {
                alert("Por favor ingresa un nombre de usuario.");
                return;
            }

            if (ADMINS_AUTORIZADOS.includes(usuario)) {
                // Es admin, mostrar campos de GitHub
                document.getElementById('btnContinuar').style.display = 'none';
                document.getElementById('inputUsuario').disabled = true;
                document.getElementById('bloqueAdmin').style.display = 'block';
            } else {
                // Es trabajador, acceso directo instantáneo
                localStorage.setItem('app_usuario', usuario);
                localStorage.setItem('app_rol', 'trabajador');
                iniciarApp('trabajador', usuario);
            }
        }

        function entrarComoAdmin() {
            const usuario = document.getElementById('inputUsuario').value.trim();
            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const token = document.getElementById('githubToken').value.trim();

            if (!owner || !repo || !token) {
                alert("Debes completar todos los datos de GitHub para administrar.");
                return;
            }

            localStorage.setItem('app_usuario', usuario);
            localStorage.setItem('app_rol', 'admin');
            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            iniciarApp('admin', usuario);
        }

        function iniciarApp(rol, usuario) {
            usuarioActual = usuario;
            rolActual = rol;

            document.getElementById('pantalla-login').style.display = 'none';
            document.getElementById('appMain').style.display = 'flex';
            document.getElementById('lblInfoUsuario').textContent = `Conectado como: ${usuario} (${rol.toUpperCase()})`;

            if (rol === 'admin') {
                document.getElementById('panelAdminControls').style.display = 'block';
                document.getElementById('terminal-container').style.display = 'flex';
                document.getElementById('thAccion').style.display = 'table-cell';
                document.getElementById('promptUser').textContent = `${usuario}@servidor:~$`;
            } else {
                document.getElementById('panelAdminControls').style.display = 'none';
                document.getElementById('terminal-container').style.display = 'none';
                document.getElementById('thAccion').style.display = 'none';
            }

            cargarTabla();
            setInterval(cargarTabla, 5000); // Sincronización automática
        }

        function cerrarSesion() {
            localStorage.removeItem('app_usuario');
            localStorage.removeItem('app_rol');
            location.reload();
        }

        // --- GITHUB API HANDLING ---
        async function obtenerArchivoGitHub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            
            // Si es trabajador, lee de forma pública sin requerir token propio
            if (rolActual === 'trabajador') {
                const pubOwner = localStorage.getItem('gh_owner') || document.getElementById('repoOwner')?.value;
                const pubRepo = localStorage.getItem('gh_repo') || document.getElementById('repoName')?.value;
                if (!pubOwner || !pubRepo) return { productos: [], sha: null };
                try {
                    const res = await fetch(`https://raw.githubusercontent.com/${pubOwner}/${pubRepo}/main/productos.json`);
                    if (!res.ok) return { productos: [], sha: null };
                    return { productos: await res.json(), sha: null };
                } catch(e) { return { productos: [], sha: null }; }
            }

            if (!owner || !repo || !token) return { productos: [], sha: null };
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/productos.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (!res.ok) return { productos: [], sha: null };
                const data = await res.json();
                return { productos: JSON.parse(atob(data.content)), sha: data.sha };
            } catch (e) { return { productos: [], sha: null }; }
        }

        async function guardarArchivoGitHub(nuevosProductos, mensajeCommit) {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/productos.json`;
            const resSha = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            const dataSha = await resSha.json();

            const body = {
                message: mensajeCommit,
                content: btoa(JSON.stringify(nuevosProductos, null, 4)),
                sha: dataSha.sha
            };

            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            return res.ok;
        }

        async function cargarTabla() {
            const datos = await obtenerArchivoGitHub();
            const productos = datos.productos || [];
            const tbody = document.getElementById('tablaProductos');
            tbody.innerHTML = '';
            
            productos.forEach(p => {
                let htmlAccion = rolActual === 'admin' ? `<td><button class="btn-danger" onclick="eliminarGitHub(${p.id})">Borrar</button></td>` : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nombre}</td>
                        <td>$${p.precio}</td>
                        ${htmlAccion}
                    </tr>
                `;
            });
        }

        // --- TERMINAL DE COMANDOS (ADMIN) ---
        const inputConsola = document.getElementById('inputComando');
        const consola = document.getElementById('consola');

        inputConsola.addEventListener('keypress', async function (e) {
            if (e.key === 'Enter') {
                const comando = inputConsola.value.trim();
                if (!comando) return;
                consola.textContent += `${usuarioActual}@servidor:~$ ${comando}\n`;
                inputConsola.value = '';

                const partes = comando.split(/\s+/);
                const cmd = partes[0].toLowerCase();
                const args = partes.slice(1);
                
                let datosActuales = await obtenerArchivoGitHub();
                let productos = datosActuales.productos || [];

                if (cmd === 'help') {
                    consola.textContent += "Comandos:\n- add [nombre] [precio]\n- del [id]\n- list\n- clear\n\n";
                } else if (cmd === 'clear') {
                    consola.textContent = "Terminal limpia.\n\n";
                } else if (cmd === 'list') {
                    if (productos.length === 0) consola.textContent += "Sin productos.\n\n";
                    else consola.textContent += "ID | Nombre | Precio\n" + productos.map(p => `${p.id} | ${p.nombre} | $${p.precio}`).join("\n") + "\n\n";
                } else if (cmd === 'add') {
                    if (args.length < 2) {
                        consola.textContent += "Uso: add [nombre] [precio]\n\n";
                    } else {
                        const precio = args.pop();
                        const nombre = args.join(" ");
                        const nuevo_id = productos.length === 0 ? 1 : productos[productos.length - 1].id + 1;
                        productos.push({ id: nuevo_id, nombre, precio });
                        
                        const exito = await guardarArchivoGitHub(productos, `Terminal (${usuarioActual}): Agregado producto ${nuevo_id}`);
                        if (exito) consola.textContent += `[OK] Producto ${nuevo_id} registrado.\n\n`;
                        else consola.textContent += "[ERROR] No se pudo guardar en GitHub.\n\n";
                    }
                } else if (cmd === 'del') {
                    if (args.length === 0) {
                        consola.textContent += "Uso: del [id]\n\n";
                    } else {
                        const idBorrar = parseInt(args[0]);
                        const filtrados = productos.filter(p => p.id !== idBorrar);
                        if (filtrados.length === productos.length) {
                            consola.textContent += "Error: ID no encontrado.\n\n";
                        } else {
                            const exito = await guardarArchivoGitHub(filtrados, `Terminal (${usuarioActual}): Eliminado producto ${idBorrar}`);
                            if (exito) consola.textContent += `[OK] Producto ${idBorrar} eliminado.\n\n`;
                            else consola.textContent += "[ERROR] No se pudo actualizar GitHub.\n\n";
                        }
                    }
                } else {
                    consola.textContent += "Comando no reconocido. Escribe 'help'.\n\n";
                }

                consola.scrollTop = consola.scrollHeight;
                cargarTabla();
            }
        });

        async function agregarGrafico() {
            const nombre = document.getElementById('guiNombre').value;
            const precio = document.getElementById('guiPrecio').value;
            if (!nombre || !precio) return;

            const datosActuales = await obtenerArchivoGitHub();
            let productos = datosActuales.productos || [];
            const nuevo_id = productos.length === 0 ? 1 : productos[productos.length - 1].id + 1;

            productos.push({ id: nuevo_id, nombre, precio });
            const exito = await guardarArchivoGitHub(productos, `GUI (${usuarioActual}): Agregado producto ${nuevo_id}`);
            
            if (exito) {
                document.getElementById('guiNombre').value = '';
                document.getElementById('guiPrecio').value = '';
                cargarTabla();
            } else {
                alert("Error al guardar en GitHub.");
            }
        }

        async function eliminarGitHub(id) {
            const datosActuales = await obtenerArchivoGitHub();
            let productos = datosActuales.productos || [];
            const filtrados = productos.filter(p => p.id !== id);

            const exito = await guardarArchivoGitHub(filtrados, `GUI (${usuarioActual}): Eliminado producto ${id}`);
            if (exito) {
                cargarTabla();
            } else {
                alert("Error al eliminar en GitHub.");
            }
        }
    </script>
</body>
</html>
