<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Cloud - GitHub</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #gui { flex: 1; padding: 20px; background: #f8f9fa; display: flex; flex-direction: column; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; }
        .form-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; padding: 4px 8px; font-size: 0.9em; }
        .btn-danger:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        
        #terminal-container { flex: 1; background: #121212; color: #00ff00; font-family: 'Consolas', monospace; padding: 20px; display: flex; flex-direction: column; }
        #consola { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; }
        .linea-input { display: flex; }
        .prompt { margin-right: 10px; }
        #inputComando { background: transparent; border: none; color: #ffffff; font-family: inherit; font-size: 1rem; flex-grow: 1; outline: none; }
    </style>
</head>
<body>

    <div id="gui">
        <div class="card">
            <h2>Configuración de GitHub</h2>
            <div class="form-group">
                <input type="text" id="repoOwner" placeholder="Tu usuario de GitHub">
                <input type="text" id="repoName" placeholder="Nombre del repositorio">
                <input type="password" id="githubToken" placeholder="GitHub Personal Access Token">
                <button onclick="guardarConfig()">Guardar Credenciales</button>
            </div>
        </div>

        <div class="card">
            <h2>Agregar Producto</h2>
            <div class="form-group">
                <input type="text" id="guiNombre" placeholder="Nombre del producto" autocomplete="off">
                <input type="number" id="guiPrecio" placeholder="Precio" autocomplete="off">
                <button onclick="agregarGrafico()">Registrar en GitHub</button>
            </div>
        </div>

        <div class="card">
            <h2>Inventario en la Nube</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Acción</th></tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>
    </div>

    <div id="terminal-container">
        <div id="consola">Conectado a GitHub Pages.\nIngresa tus datos arriba para sincronizar con tu repositorio.\n\n</div>
        <div class="linea-input">
            <span class="prompt">github@cloud:~$</span>
            <input type="text" id="inputComando" autocomplete="off">
        </div>
    </div>

    <script>
        // Cargar configuración guardada localmente en el navegador para no escribirla siempre
        document.getElementById('repoOwner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('repoName').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('githubToken').value = localStorage.getItem('gh_token') || '';

        function guardarConfig() {
            localStorage.setItem('gh_owner', document.getElementById('repoOwner').value);
            localStorage.setItem('gh_repo', document.getElementById('repoName').value);
            localStorage.setItem('gh_token', document.getElementById('githubToken').value);
            alert("Credenciales guardadas en este navegador.");
            cargarDatosGitHub();
        }

        async function obtenerArchivoGitHub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!owner || !repo || !token) return null;

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/productos.json`;
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!res.ok) return { productos: [], sha: null };
                const data = await res.json();
                const contenidoDecodificado = JSON.parse(atob(data.content));
                return { productos: contenidoDecodificado, sha: data.sha };
            } catch (e) {
                return { productos: [], sha: null };
            }
        }

        async function guardarArchivoGitHub(nuevosProductos, mensajeCommit) {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!owner || !repo || !token) {
                alert("Faltan configurar las credenciales de GitHub arriba.");
                return false;
            }

            // Obtener el SHA actual del archivo (necesario para actualizarlo en la API de GitHub)
            const actual = await obtenerArchivoGitHub();
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/productos.json`;
            
            const contenidoCodificado = btoa(JSON.stringify(nuevosProductos, null, 4));

            const body = {
                message: mensajeCommit,
                content: contenidoCodificado,
                sha: actual.sha
            };

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            return res.ok;
        }

        async function cargarDatosGitHub() {
            const datos = await obtenerArchivoGitHub();
            if (!datos) return;
            const productos = datos.productos;
            
            const tbody = document.getElementById('tablaProductos');
            tbody.innerHTML = '';
            productos.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nombre}</td>
                        <td>$${p.precio}</td>
                        <td><button class="btn-danger" onclick="eliminarGitHub(${p.id})">Borrar</button></td>
                    </tr>
                `;
            });
        }

        async function agregarGrafico() {
            const nombre = document.getElementById('guiNombre').value;
            const precio = document.getElementById('guiPrecio').value;
            if (!nombre || !precio) return;

            const datosActuales = await obtenerArchivoGitHub();
            const productos = datosActuales ? datosActuales.productos : [];
            const nuevo_id = productos.length === 0 ? 1 : productos[productos.length - 1].id + 1;

            productos.push({ id: nuevo_id, nombre, precio });
            
            const exito = await guardarArchivoGitHub(productos, `Agregado producto ID ${nuevo_id}`);
            if (exito) {
                document.getElementById('guiNombre').value = '';
                document.getElementById('guiPrecio').value = '';
                cargarDatosGitHub();
                document.getElementById('consola').textContent += `[OK] Producto ${nuevo_id} guardado en GitHub.\n`;
            } else {
                alert("Error al guardar en GitHub. Revisa tus credenciales.");
            }
        }

        async function eliminarGitHub(id) {
            const datosActuales = await obtenerArchivoGitHub();
            if (!datosActuales) return;
            let productos = datosActuales.productos;
            
            productos = productos.filter(p => p.id !== id);
            
            const exito = await guardarArchivoGitHub(productos, `Eliminado producto ID ${id}`);
            if (exito) {
                cargarDatosGitHub();
                document.getElementById('consola').textContent += `[OK] Producto ${id} eliminado de GitHub.\n`;
            } else {
                alert("Error al eliminar en GitHub.");
            }
        }

        // Cargar al iniciar si ya hay credenciales
        cargarDatosGitHub();
    </script>
</body>
</html>
